version: '3.8'

services:
  # ===== 模型API服务 =====
  model-api:
    build: ./backend
    container_name: football-model-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - RUN_SCHEDULER=1
      - TRAESOLO_INITIAL_CRAWL=0
      - DATABASE_URL=mysql+pymysql://football:football@mysql:3306/football_analytics
      - TRAESOLO_JSON_LOGS=1
      - TRAESOLO_PRODUCTION=${TRAESOLO_PRODUCTION:-0}
      - TRAESOLO_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - football-net

  # ===== 前端Vue服务 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: football-frontend
    ports:
      - "80:80"
    depends_on:
      model-api:
        condition: service_healthy
    restart: always
    networks:
      - football-net

  # ===== Redis缓存 =====
  redis:
    image: redis:7-alpine
    container_name: football-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - football-net

  # ===== MySQL =====
  mysql:
    image: mysql:8.0
    container_name: football-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: football_analytics
      MYSQL_USER: football
      MYSQL_PASSWORD: football
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufootball", "-pfootball"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - football-net

  # ===== RQ 异步任务 Worker =====
  rq-worker:
    build: ./backend
    container_name: football-rq-worker
    command: ["python", "worker.py"]
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - RUN_SCHEDULER=0
      - DATABASE_URL=mysql+pymysql://football:football@mysql:3306/football_analytics
      - TRAESOLO_JOB_QUEUE_ENABLED=1
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: always
    networks:
      - football-net

networks:
  football-net:
    driver: bridge

volumes:
  mysql-data:
