# 线上场景：MariaDB/MySQL、Redis 在宿主机且只监听 127.0.0.1；
# 后端用 Docker + host 网络（与裸机一样连 127.0.0.1），代码目录挂载在宿主机。
#
# 适用路径：/u01/app/traesolo
#
# 启动前务必停掉旧的宿主机 python（占 8000），见下方注释。
#
#   cd /u01/app/traesolo
#   docker compose -f docker-compose.host.yml --env-file .env up -d --build

services:
  # host 网络：可直接访问宿主机 127.0.0.1:3306 / 6379，无需改 MariaDB bind-address
  model-api:
    build: ./backend
    container_name: football-model-api
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - OPENBLAS_NUM_THREADS=1
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379/0}
      - RUN_SCHEDULER=${RUN_SCHEDULER:-1}
      - TRAESOLO_INITIAL_CRAWL=${TRAESOLO_INITIAL_CRAWL:-0}
      - DATABASE_URL=${DATABASE_URL}
      - TRAESOLO_JSON_LOGS=${TRAESOLO_JSON_LOGS:-1}
      - TRAESOLO_PRODUCTION=${TRAESOLO_PRODUCTION:-1}
      - TRAESOLO_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/venv
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  rq-worker:
    build: ./backend
    container_name: football-rq-worker
    network_mode: host
    command: ["python", "worker.py"]
    environment:
      - PYTHONUNBUFFERED=1
      - OPENBLAS_NUM_THREADS=1
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379/0}
      - RUN_SCHEDULER=0
      - DATABASE_URL=${DATABASE_URL}
      - TRAESOLO_JOB_QUEUE_ENABLED=1
      - TRAESOLO_PRODUCTION=${TRAESOLO_PRODUCTION:-1}
      - TRAESOLO_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/venv
    restart: always

  # 前端仍用 bridge；经 host.docker.internal 反代到宿主机 8000
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: football-frontend
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/nginx.host.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      model-api:
        condition: service_healthy
    restart: always
