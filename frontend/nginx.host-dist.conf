# 宿主机 Nginx：静态站点 = frontend/dist，API 反代本机 Docker 后端 :8000
# 安装示例（路径按实际调整）：
#   sudo cp /u01/app/traesolo/frontend/nginx.host-dist.conf /etc/nginx/sites-available/traesolo
#   sudo ln -sf /etc/nginx/sites-available/traesolo /etc/nginx/sites-enabled/traesolo
#   sudo nginx -t && sudo systemctl reload nginx
#
# 若用 conf.d 风格（无 sites-enabled）：
#   sudo cp ... /etc/nginx/conf.d/traesolo.conf

server {
    listen 80;
    server_name _;

    root /u01/app/traesolo/frontend/dist;
    index index.html;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（Docker model-api 使用 network_mode: host，监听 127.0.0.1:8000）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # 队徽/头像等后端静态资源
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
